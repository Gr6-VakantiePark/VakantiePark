
name: Discord PR Notifications

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - closed

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    name: Send Discord Notification
    runs-on: ubuntu-latest

    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          if [ "$ACTION" = "closed" ]; then
            if [ "$MERGED" = "true" ]; then
              STATUS="Merged"
              COLOR=5763719
            else
              STATUS="Closed without merging"
              COLOR=15548997
            fi
          else
            STATUS="Opened"
            COLOR=3447003
          fi

          jq -n \
            --arg title "$PR_TITLE" \
            --arg url "$PR_URL" \
            --arg author "$PR_AUTHOR" \
            --arg number "$PR_NUMBER" \
            --arg base "$BASE_BRANCH" \
            --arg head "$HEAD_BRANCH" \
            --arg status "$STATUS" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: ("Pull Request #" + $number + ": " + $title),
                url: $url,
                color: $color,
                fields: [
                  {
                    name: "Status",
                    value: $status,
                    inline: true
                  },
                  {
                    name: "Author",
                    value: $author,
                    inline: true
                  },
                  {
                    name: "Target Branch",
                    value: $base,
                    inline: true
                  },
                  {
                    name: "Source Branch",
                    value: $head,
                    inline: true
                  }
                ],
                footer: {
                  text: "GitHub Pull Request"
                }
              }]
            }' > payload.json

          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -X POST \
            -d @payload.json \
            "$DISCORD_WEBHOOK"
