name: Discord PR Notifications

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - closed

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: discord-pr-${{ github.event.pull_request.number }}-${{ github.event.action }}
  cancel-in-progress: false

jobs:
  notify:
    name: Send Discord Notification
    runs-on: ubuntu-latest
    if: github.event.action != 'opened' || github.event.pull_request.draft == false

    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ACTION: ${{ github.event.action }}
          PR_JSON: ${{ toJSON(github.event.pull_request) }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "::warning::DISCORD_WEBHOOK secret is not set, skipping notification."
            exit 0
          fi

          MERGED=$(jq -r '.merged' <<< "$PR_JSON")

          case "$ACTION" in
            opened)           STATUS="🆕 Opened";            COLOR=3447003 ;;
            reopened)         STATUS="🔁 Reopened";          COLOR=15105570 ;;
            ready_for_review) STATUS="👀 Ready for review";  COLOR=10181046 ;;
            closed)
              if [ "$MERGED" = "true" ]; then
                STATUS="✅ Merged";                         COLOR=5763719
              else
                STATUS="❌ Closed without merging";         COLOR=15548997
              fi ;;
            *)                STATUS="$ACTION";              COLOR=9807270 ;;
          esac

          jq -n \
            --argjson pr "$PR_JSON" \
            --arg status "$STATUS" \
            --argjson color "$COLOR" \
            --arg action "$ACTION" \
            --arg repo "$REPOSITORY" \
            '
            def trimmed($max):
              if . == null or . == "" then "_No description._"
              else (gsub("<!--.*?-->"; ""; "s") | gsub("\r"; "") | gsub("\n{3,}"; "\n\n") | ltrimstr("\n") | rtrimstr("\n"))
                | if length > $max then .[0:$max] + "…" else . end
              end;

            def linked_issues:
              [ (.body // "") | scan("(?i)\\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\\s*:?\\s+#(\\d+)") | .[0] ]
              | unique_by(tonumber) | map("#" + .) | join(", ");

            ($pr | linked_issues) as $issues
            | ([$pr.labels[]?.name] | join(", ")) as $labels
            | ([$pr.requested_reviewers[]?.login] | join(", ")) as $reviewers
            | {
                username: "GitHub",
                embeds: [{
                  author: {
                    name: $pr.user.login,
                    url: $pr.user.html_url,
                    icon_url: $pr.user.avatar_url
                  },
                  title: ("#" + ($pr.number | tostring) + " " + $pr.title)[0:256],
                  url: $pr.html_url,
                  description: ($pr.body | trimmed(400)),
                  color: $color,
                  fields: (
                    [
                      { name: "Status", value: $status, inline: true },
                      { name: "Branch", value: ("`" + $pr.head.ref + "` → `" + $pr.base.ref + "`"), inline: true },
                      { name: "Changes",
                        value: (($pr.commits | tostring) + " commits · " + ($pr.changed_files | tostring) + " files · +" + ($pr.additions | tostring) + " / -" + ($pr.deletions | tostring)),
                        inline: true }
                    ]
                    + (if $issues != "" then [{ name: (if $action == "closed" and $pr.merged then "Resolved" else "Resolves" end), value: $issues, inline: true }] else [] end)
                    + (if $reviewers != "" and $action != "closed" then [{ name: "Reviewers", value: $reviewers, inline: true }] else [] end)
                    + (if $labels != "" then [{ name: "Labels", value: $labels, inline: true }] else [] end)
                    + (if $pr.merged and $pr.merged_by != null then [{ name: "Merged by", value: $pr.merged_by.login, inline: true }] else [] end)
                  ),
                  footer: { text: $repo },
                  timestamp: (if $action == "closed" then ($pr.closed_at // $pr.updated_at) else $pr.updated_at end)
                }]
              }
            ' > payload.json

          curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 2 --retry-all-errors \
            -H "Content-Type: application/json" \
            -X POST \
            -d @payload.json \
            "$DISCORD_WEBHOOK"
