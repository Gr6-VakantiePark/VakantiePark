<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Afbeelding placeholder</title>
  <desc id="desc">Grijze placeholder voor een afbeelding die studenten zelf kunnen toevoegen.</desc>
  <rect width="1600" height="1000" fill="#d4d4d4"/>
  <rect x="48" y="48" width="1504" height="904" fill="none" stroke="#a3a3a3" stroke-width="4"/>
  <g fill="#737373" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="800" y="480" font-size="54" font-weight="700">AFBEELDING</text>
    <text x="800" y="545" font-size="28">zelf toevoegen</text>
  </g>
